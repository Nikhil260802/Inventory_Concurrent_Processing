spring.application.name=Inventory_Concurrent_Processing

# =============================================================================
# DataSource – MySQL
# Update the URL / credentials to match your local MySQL instance.
# =============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=Nikhil@2601
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP defaults are usually fine; shown here for clarity)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# =============================================================================
# JPA / Hibernate DDL Auto-Generation
# Setting to 'update' ensures Hibernate automatically creates/updates all tables
# (inventory, processing_job, processing_error) and indexes on application startup.
# =============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# =============================================================================
# Flyway – database migration
# =============================================================================
# Flyway is disabled so Hibernate's ddl-auto=update directly creates the schema
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =============================================================================
# Multipart – CSV file upload limits
# =============================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# =============================================================================
# Logging
# =============================================================================
logging.level.root=INFO
logging.level.Inventory_Concurrent_Processing=DEBUG
logging.level.org.flywaydb=INFO

